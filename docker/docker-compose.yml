# CasGists Docker Compose - Production Configuration
# BASE SPEC Compliant: Binds to 172.17.0.1 for security

name: casgist

services:
  casgist:
    image: ghcr.io/casapps/casgist:latest
    container_name: casgist
    restart: unless-stopped
    ports:
      - "172.17.0.1:64080:80"  # Production: bind to Docker bridge for reverse proxy
    environment:
      # Database - PostgreSQL for production
      - CASGISTS_DB_TYPE=postgres
      - CASGISTS_DB_DSN=postgres://casgist:${POSTGRES_PASSWORD:-casgist}@postgres:5432/casgist?sslmode=disable

      # Server
      - CASGISTS_DATA_DIR=/data
      - CASGISTS_LOG_DIR=/var/log/casgist
      - CASGISTS_SECRET_KEY=${SECRET_KEY}

      # Features
      - CASGISTS_FEATURES_REGISTRATION=true
      - CASGISTS_FEATURES_ORGANIZATIONS=true

      # Cache - Valkey for production
      - CASGISTS_CACHE_TYPE=valkey
      - CASGISTS_CACHE_URL=valkey://valkey:6379
    volumes:
      - ./rootfs/data/casgist:/data
      - ./rootfs/config/casgist:/config
    depends_on:
      - postgres
      - valkey
    networks:
      - casgist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: casgist_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=casgist
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-casgist}
      - POSTGRES_DB=casgist
    volumes:
      - ./rootfs/db/postgres:/var/lib/postgresql/data
    networks:
      - casgist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casgist"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    container_name: casgist_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --requirepass ${VALKEY_PASSWORD:-casgist}
    volumes:
      - ./rootfs/db/valkey:/data
    networks:
      - casgist
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  casgist:
    driver: bridge
    external: false
