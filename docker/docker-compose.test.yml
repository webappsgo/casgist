name: casgist-test

services:
  casgist:
    image: ghcr.io/casapps/casgist:latest
    container_name: casgist-test
    restart: "no"
    environment:
      - MODE=development
      - DEBUG=true
      - TZ=America/New_York
    ports:
      - "64581:80"
    volumes:
      # TEMP DIR WORKFLOW: ./rootfs/ resolves to $TEMP_DIR/rootfs/
      # NEVER run from project directory - always use temp dir workflow
      - ./rootfs/config:/config
      - ./rootfs/data:/data
    networks:
      - casgist-test

networks:
  casgist-test:
    name: casgist-test
    external: false
