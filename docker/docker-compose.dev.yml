# CasGists Docker Compose - Development Configuration
# BASE SPEC Compliant: Binds to 172.17.0.1 for security

name: casgist

services:
  casgist:
    container_name: casgist-dev
    restart: unless-stopped
    ports:
      - "172.17.0.1:64188:80"
    environment:
      # Server
      - CASGISTS_DATA_DIR=/data
      - CASGISTS_LOG_DIR=/var/log/casgist
      - CASGISTS_SECRET_KEY=${SECRET_KEY}

      # Features
      - CASGISTS_FEATURES_REGISTRATION=true
      - CASGISTS_FEATURES_ORGANIZATIONS=true

    volumes:
      - /tmp/casapps/casgist/rootfs/data/casgist:/data
      - /tmp/casapps/casgist/rootfs/config/casgist:/config
    networks:
      - casgist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  casgist:
    driver: bridge
    external: false
